; PlatformIO Project Configuration File
;
; ESP32-C3 SuperMini 蓝牙发送端（主控，决定 SOS 闪烁节拍）
;
; 用法：用 PlatformIO 打开 sender 这个文件夹（而不是上一级的 test 文件夹），
;       直接点 Build / Upload 就会编译并烧录发送端代码，无需任何 -e 参数。

[env:esp32-c3]
; 锁 7.1.3 = 本机已装的 Arduino 2.0.17（Bluedroid BLE + 旧 ledcSetup API）。
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
