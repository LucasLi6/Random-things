<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servo Control</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --fg: #1c1e21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --track: #e5e7eb;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1b1e25;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --track: #2a2e37;
      --danger: #f87171;
      --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  #status {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    background: var(--track);
    color: var(--muted);
    margin-bottom: 20px;
  }
  #status.connected { background: var(--ok); color: #fff; }
  #status.connecting { background: var(--accent-soft); color: var(--accent); }
  #status.error { background: var(--danger); color: #fff; }

  .slider-wrap {
    position: relative;
    width: 64px;
    height: 260px;
    margin: 0 auto 16px;
    touch-action: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .slider-track {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    transform: translateX(-50%);
    width: 14px;
    border-radius: 999px;
    background: var(--track);
  }
  .slider-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    border-radius: 999px;
    background: var(--accent);
  }
  .slider-ticks { position: absolute; inset: 0; pointer-events: none; }
  .tick {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--muted);
    opacity: 0.35;
  }
  .slider-thumb {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--card);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #level-readout {
    font-size: 40px;
    font-weight: 700;
    margin: 8px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .unit { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Servo Control</h1>
    <p class="sub">Drag slider up · auto-returns to zero</p>
    <span id="status">Not connected</span>

    <div class="slider-wrap" id="slider">
      <div class="slider-track">
        <div class="slider-fill" id="fill"></div>
        <div class="slider-ticks">
          <span class="tick" style="bottom:0%"></span>
          <span class="tick" style="bottom:25%"></span>
          <span class="tick" style="bottom:50%"></span>
          <span class="tick" style="bottom:75%"></span>
          <span class="tick" style="bottom:100%"></span>
        </div>
        <div class="slider-thumb" id="thumb"></div>
      </div>
    </div>

    <div id="level-readout">0</div>
    <div class="unit" id="angle-readout">Servo angle 180°</div>

    <button id="btn">Connect servo</button>

    <p class="hint hidden" id="hint-ios">On iPhone, open this page in <b>Bluefy</b>; on Android use Chrome.</p>
    <p class="hint hidden" id="hint-unsupported">This browser doesn't support Bluetooth. Use Chrome (Android) or Bluefy (iPhone).</p>
  </div>

<script>
(function () {
  'use strict';

  // Keep in sync with receiver/src/main.cpp
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHAR_PHONE_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
  const DEVICE_PREFIX = 'ESP32-LED-RX';

  // 5 levels: sent values snap to the nearest level and map to a servo angle (matches receiver)
  const LEVELS = [0, 25, 50, 75, 100];
  const ANGLES = [180, 141, 103, 64, 25];

  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btn');
  const slider = document.getElementById('slider');
  const fill = document.getElementById('fill');
  const thumb = document.getElementById('thumb');
  const readout = document.getElementById('level-readout');
  const angleReadout = document.getElementById('angle-readout');
  const hintIos = document.getElementById('hint-ios');
  const hintUnsupported = document.getElementById('hint-unsupported');

  let device = null;
  let char = null;
  let level = 0;
  let lastSent = -1;
  let dragging = false;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  // 0~100 continuous value -> snap to nearest of the 5 levels
  function snapLevel(v) {
    const idx = Math.max(0, Math.min(4, Math.round(v / 25)));
    return LEVELS[idx];
  }

  // level value -> servo angle (display only, matches receiver)
  function angleFor(l) {
    return ANGLES[Math.max(0, Math.min(4, Math.round(l / 25)))];
  }

  function setSlider(l, animate) {
    level = snapLevel(l);
    thumb.style.transition = animate ? 'bottom 0.22s ease-out' : 'none';
    fill.style.transition = animate ? 'height 0.22s ease-out' : 'none';
    thumb.style.bottom = level + '%';
    fill.style.height = level + '%';
    readout.textContent = Math.round(level);
    angleReadout.textContent = 'Servo angle ' + angleFor(level) + '°';
  }

  async function sendLevel(l) {
    const v = Math.round(Math.max(0, Math.min(100, l)));
    if (!char || v === lastSent) return;
    lastSent = v;
    try {
      await char.writeValueWithoutResponse(new Uint8Array([v]));
    } catch (e) {
      console.warn('write failed', e);
    }
  }

  // pointer Y -> one of the 5 levels (bottom = 0, top = 100)
  function levelFromY(clientY) {
    const rect = slider.getBoundingClientRect();
    const pct = (rect.bottom - clientY) / rect.height;
    return snapLevel(Math.max(0, Math.min(1, pct)) * 100);
  }

  slider.addEventListener('pointerdown', (e) => {
    if (!char) { setStatus('Connect first', 'error'); return; }
    dragging = true;
    slider.setPointerCapture(e.pointerId);
    const l = levelFromY(e.clientY);
    setSlider(l, false);
    sendLevel(l);
  });
  slider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const l = levelFromY(e.clientY);
    setSlider(l, false);
    sendLevel(l);
  });
  function release() {
    if (!dragging) return;
    dragging = false;
    setSlider(0, true);   // auto-return to zero on release
    sendLevel(0);
  }
  slider.addEventListener('pointerup', release);
  slider.addEventListener('pointercancel', release);

  // --- Bluetooth ---
  async function connect() {
    if (!navigator.bluetooth) {
      hintUnsupported.classList.remove('hidden');
      hintIos.classList.add('hidden');
      setStatus('Bluetooth not supported', 'error');
      return;
    }
    try {
      setStatus('Connecting…', 'connecting');
      btn.disabled = true;
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: DEVICE_PREFIX }],
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      char = await service.getCharacteristic(CHAR_PHONE_UUID);
      lastSent = -1;
      setStatus('Connected: ' + (device.name || DEVICE_PREFIX), 'connected');
      btn.textContent = 'Disconnect';
    } catch (e) {
      if (e && e.name === 'NotFoundError') {
        setStatus('Cancelled', '');
      } else {
        setStatus('Connect failed', 'error');
        console.warn(e);
      }
    } finally {
      btn.disabled = false;
    }
  }

  function disconnect() {
    if (device && device.gatt.connected) {
      device.gatt.disconnect();   // triggers gattserverdisconnected -> onDisconnected
    }
  }

  function onDisconnected() {
    char = null;
    lastSent = -1;
    dragging = false;
    setStatus('Disconnected', '');
    btn.textContent = 'Connect servo';
    if (device) {
      device.removeEventListener('gattserverdisconnected', onDisconnected);
      device = null;
    }
  }

  btn.addEventListener('click', () => {
    if (device && device.gatt.connected) {
      disconnect();
    } else {
      connect();
    }
  });

  // show hint based on browser/platform
  if (!navigator.bluetooth) {
    hintUnsupported.classList.remove('hidden');
  } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    hintIos.classList.remove('hidden');
  }

  setSlider(0, false);
})();
</script>
</body>
</html>
