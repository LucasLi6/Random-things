; PlatformIO Project Configuration File
;
; ESP32-C3 SuperMini 蓝牙接收端（从机，跟随发送端的灯信号）
;
; 用法：用 PlatformIO 打开 receiver 这个文件夹（而不是上一级的 test 文件夹），
;       直接点 Build / Upload 就会编译并烧录接收端代码，无需任何 -e 参数。

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
